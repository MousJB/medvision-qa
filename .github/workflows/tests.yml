name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked:
    # The exact environment of requirements-lock.txt (Python 3.12).
    name: locked deps · ${{ matrix.os }} · Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Test
        run: python -m pytest
      - name: Reproduce the real MRI evaluation
        run: python -m medvision_qa experiments/brain_mri/figshare_eval/config.toml -o reports/figshare.html

  minimum:
    # The lowest supported Python, with the newest dependencies that still support it.
    name: latest deps · ubuntu-latest · Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
