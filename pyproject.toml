[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medvision-qa"
version = "0.0.1"
description = "Comparative verification and technical documentation of medical image classification model versions. Not a medical device."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
images = [
    "pillow>=10",
]
dev = [
    "medvision-qa[web,images]",
    "pytest>=8",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medvision_qa = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
