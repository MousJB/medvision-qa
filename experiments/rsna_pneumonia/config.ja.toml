# config.toml の日本語版（自由記述のテキストのみ翻訳）。値はすべて事前登録された config.toml と同一。
# 公式の Version Verification Record（reports/）は config.toml から生成した。
schema_version = "0.1"

[evaluation]
title = "RSNA 肺野陰影 — Faster R-CNN ResNet-50 FPN、512 px（A）対 384 px（B）"
objective = "患者単位で分離したテスト分割において、入力解像度を 512 px から 384 px に下げても（GTX 1650 の float32 で学習が約 1.4 倍速い）、画像単位の肺野陰影の検出が悪化しないことを確認する：B の AUROC、感度、特異度が A に劣らない。"

[classes]
order = ["no_opacity", "opacity"]
positive = ["opacity"]   # 肺野陰影のボックスが 1 つ以上ある画像 対 ない画像

[data]
ground_truth_mode = "separate_file"
ground_truth_file = "medvision/ground_truth.csv"
description = "RSNA Pneumonia Detection Challenge（Kaggle、stage 2 train）、NIH ChestX-ray14 由来の正面胸部 X 線画像 26,684 枚。テスト分割 = NIH の患者 2,290 人の 5,349 枚（陰影あり 1,207 枚）、患者単位で抽出（シード 20261030）。学習用・検証用と共通する患者はいない。分割：metadata/split.csv、SHA-256 9ec285f5399c198c1d0cd23f1e5b3a9e9b99cee3ab18bccd473115fd4cb7040c。manifest_sha256 = metadata/raw_manifest.csv（ダウンロードした全ファイルの SHA-256）。"
nature = "clinical"
manifest_sha256 = "9484bad013e24091845ac15072cc6e9ce7bb4ecc9b22c83f59b0259883b12af7"

[versions.A]
id = "frcnn-r50-fpn-512"
predictions_file = "medvision/preds_r50_512.csv"
code_commit = "afe4b6d1e44ee5d9e571c6aaebcbfdd6b3835411"
weights_sha256 = "c549004887baad79659ca5a220a1931e49d1a051bda72f9cc561684c8c683c3b"
preprocessing = "DICOM（uint8、1024 px）→ 512 px PNG（PIL BOX、面積平均）。[0, 1]、3 チャネルに複製。ImageNet の正規化はモデル内部。512 px のまま入力（リサイズなし）"
description = "torchvision fasterrcnn_resnet50_fpn、COCO_V1 重み、2 クラスヘッド、trainable_backbone_layers = 3。score_opacity = 最大のボックススコアを、検証で選んだ閾値 τ が 0.5 になるよう変換したもの（PROTOCOL.md §7.4）"

[versions.B]
id = "frcnn-r50-fpn-384"
predictions_file = "medvision/preds_r50_384.csv"
code_commit = "afe4b6d1e44ee5d9e571c6aaebcbfdd6b3835411"
weights_sha256 = "462f1b293bbca8deda6489c8bd4c1a2cb663530f01e28238cf4ce809ab4cd4c2"
preprocessing = "同じ 512 px PNG。モデル内部で 384 px にリサイズ（双線形、torchvision GeneralizedRCNNTransform）。ボックスは 512 px の座標で返される"
description = "A と同じモデル、学習方法、シード、予算。唯一の変更：min_size = max_size = 384。検証で選んだ自身の τ で同じスコア変換"

[statistics]
confidence_level = 0.95
bootstrap_resamples = 2000
seed = 20261030

[sample_size]
status = "based_on_data_availability"
justification = "サンプルサイズは公開データセットと、ステップ 2（commit abfc675）で固定した患者単位の 70/10/20 分割によって決まった。検出力の計算は行っていない。"

[[criteria]]
id = "C1"
description = "B の画像単位 AUROC（陰影あり 対 なし）が A に劣らない（マージン 0.02）"
kind = "non_inferiority"
metric = "auroc"
margin = 0.02

[[criteria]]
id = "C2"
description = "τ における B の画像単位の感度が、τ における A に劣らない（マージン 0.05）"
kind = "non_inferiority"
metric = "sensitivity"
margin = 0.05

[[criteria]]
id = "C3"
description = "τ における B の画像単位の特異度が、τ における A に劣らない（マージン 0.05）"
kind = "non_inferiority"
metric = "specificity"
margin = 0.05
