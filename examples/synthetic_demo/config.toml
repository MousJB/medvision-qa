# MedVision QA demo — SYNTHETIC DATA (see generate.py).
schema_version = "0.1"

[evaluation]
title = "Synthetic demonstration — MRI classifier v1 vs v2"
objective = "Check that v2 is not inferior to v1 in macro-F1, that its tumour sensitivity stays ≥ 0.90, and test whether its AUROC is superior."

[classes]
order = ["glioma", "meningioma", "notumor", "pituitary"]
positive = ["glioma", "meningioma", "pituitary"]   # tumour vs notumor

[data]
ground_truth_mode = "separate_file"
ground_truth_file = "ground_truth.csv"
description = "Cases simulated by generate.py (seed 20261029): 450 patients, 1 to 3 images each."
nature = "synthetic"
manifest_sha256 = ""

[versions.A]
id = "demo-cnn-v1"
predictions_file = "preds_v1.csv"
description = "Simulated reference version"

[versions.B]
id = "demo-cnn-v2"
predictions_file = "preds_v2.csv"
description = "Simulated candidate version"

[statistics]
confidence_level = 0.95
bootstrap_resamples = 2000
seed = 20261029

[sample_size]
status = "not_applicable"
justification = "Synthetic demonstration data: no inference about a real population is intended."

[[criteria]]
id = "C1"
description = "Macro-F1 of v2 not inferior to v1 (margin 0.02)"
kind = "non_inferiority"
metric = "macro_f1"
margin = 0.02

[[criteria]]
id = "C2"
description = "Tumour sensitivity of v2 ≥ 0.90"
kind = "absolute"
metric = "sensitivity"
threshold = 0.90

[[criteria]]
id = "C3"
description = "Tumour AUROC of v2 superior to v1"
kind = "superiority"
metric = "auroc"
